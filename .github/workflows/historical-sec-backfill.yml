name: Historical SEC Backfill

on:
  workflow_dispatch:
    inputs:
      start_period:
        description: 'Start period (e.g. 2006-Q1)'
        required: true
        default: '2006-Q1'
      end_period:
        description: 'End period (e.g. 2010-Q4)'
        required: true
        default: '2010-Q4'
      batch_size:
        description: 'Batch size for database insertion'
        required: true
        default: '5000'
      force:
        description: 'Force re-processing of completed periods'
        required: true
        type: boolean
        default: false

jobs:
  historical-sec-backfill:
    name: Production SEC Historical Dataset Backfill
    runs-on: ubuntu-latest

    env:
      SEC_STORE_RAW_PAYLOAD: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets Configuration
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty. Please set DATABASE_URL secret in repository settings."
            exit 1
          fi
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT secret is missing or empty. Please set SEC_USER_AGENT secret in repository settings."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Run Historical Ingestion Engine
        run: |
          if [ "${FORCE}" = "true" ]; then
            python main.py historical \
              --start "${START_PERIOD}" \
              --end "${END_PERIOD}" \
              --batch-size "${BATCH_SIZE}" \
              --force
          else
            python main.py historical \
              --start "${START_PERIOD}" \
              --end "${END_PERIOD}" \
              --batch-size "${BATCH_SIZE}"
          fi
        env:
          START_PERIOD: ${{ github.event.inputs.start_period }}
          END_PERIOD: ${{ github.event.inputs.end_period }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          FORCE: ${{ github.event.inputs.force }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_STORE_RAW_PAYLOAD: "false"

      - name: Verify Range Ingestion & Output Final Report
        run: |
          python scripts/verify_ingestion.py --verify-range --start "${START_PERIOD}" --end "${END_PERIOD}"
        env:
          START_PERIOD: ${{ github.event.inputs.start_period }}
          END_PERIOD: ${{ github.event.inputs.end_period }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_STORE_RAW_PAYLOAD: "false"
