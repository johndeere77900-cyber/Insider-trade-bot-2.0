name: Historical SEC Ingestion Smoke Test

on:
  workflow_dispatch:

jobs:
  historical-sec-smoke:
    name: Real SEC to Neon Historical Ingestion Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets Configuration
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty. Please set DATABASE_URL secret in repository settings."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run First Historical Ingestion (SEC 2006-Q1)
        run: |
          python main.py historical --start 2006-Q1 --end 2006-Q1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'InsiderTradeBot/2.0 contact@example.com' }}

      - name: Verify First Ingestion & Data Quality
        run: |
          python scripts/verify_ingestion.py --run 1 --period 2006-Q1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Second Historical Ingestion (Idempotency Test)
        run: |
          python main.py historical --start 2006-Q1 --end 2006-Q1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'InsiderTradeBot/2.0 contact@example.com' }}

      - name: Verify Idempotency & Output Summary Report
        run: |
          python scripts/verify_ingestion.py --run 2 --period 2006-Q1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
