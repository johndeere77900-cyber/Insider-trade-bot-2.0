name: Insider Trade Bot 2.0 - Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnostic:
    name: Full Agent Diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show environment
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Test core module imports
        run: |
          python - <<'PY'
          modules = [
              "core.models",
              "data.normalization",
              "validation.records",
              "data.ingestion_pipeline",
              "database.connection",
              "storage.repository",
              "backtesting.engine",
              "outcomes.engine",
              "research.performance",
              "signals.signal_engine",
              "trading.portfolio",
              "application.service",
          ]

          failures = []

          for module in modules:
              try:
                  __import__(module)
                  print(f"PASS: {module}")
              except Exception as exc:
                  print(f"FAIL: {module}")
                  print(f"  {type(exc).__name__}: {exc}")
                  failures.append(module)

          if failures:
              print("\nFailed imports:")
              for module in failures:
                  print(f" - {module}")
              raise SystemExit(1)
          PY

      - name: Run pytest
        run: |
          pytest -q

      - name: Verify Neon PostgreSQL integration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import uuid

          from database.connection import (
              connect,
              initialize_database,
              is_postgresql_url,
          )
          from storage.repository import Repository

          database_url = os.environ.get("DATABASE_URL", "").strip()

          if not database_url:
              raise SystemExit("DATABASE_URL secret is missing.")

          if not is_postgresql_url(database_url):
              raise SystemExit(
                  "DATABASE_URL is not a PostgreSQL URL."
              )

          initialize_database(database_url)

          run_id = (
              "ITB2_GITHUB_NEON_TEST_"
              + uuid.uuid4().hex
          )

          repository = Repository(database_url)

          repository.store(
              table="trade_runs",
              record={
                  "run_id": run_id,
                  "mode": "paper",
                  "status": "integration_test",
                  "started_at": "2026-01-01T00:00:00+00:00",
              },
          )

          with connect(database_url) as connection:
              row = connection.execute(
                  """
                  SELECT run_id, mode, status
                  FROM trade_runs
                  WHERE run_id = %s
                  """,
                  (run_id,),
              ).fetchone()

          if row is None:
              raise SystemExit(
                  "Neon write/read verification failed."
              )

          if tuple(row) != (
              run_id,
              "paper",
              "integration_test",
          ):
              raise SystemExit(
                  "Neon returned unexpected test data."
              )

          with connect(database_url) as connection:
              connection.execute(
                  """
                  DELETE FROM trade_runs
                  WHERE run_id = %s
                  """,
                  (run_id,),
              )
              connection.commit()

          print(
              "PASS: GitHub runner connected to Neon PostgreSQL."
          )
          print(
              "PASS: Application repository wrote and read a record."
          )
          print(
              "PASS: Temporary integration record was deleted."
          )
          PY

      - name: Diagnostic summary
        if: always()
        run: |
          echo "========================================"
          echo "Insider Trade Bot 2.0 Diagnostic"
          echo "========================================"
          echo "Compilation, imports, tests, and Neon"
          echo "PostgreSQL integration were executed above."
          echo "========================================"
