name: Insider Trade Bot 2.0 - Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show environment
        run: |
          python --version
          pip --version
          git --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Import core modules
        run: |
          python - <<'PY'
          import application
          import backtesting
          import config
          import core
          import data
          import database
          import execution
          import ingestion
          import outcomes
          import research
          import risk
          import signals
          import storage
          import telegram
          import trading
          import validation

          print("PASS: Core package imports completed.")
          PY

      - name: Run test suite
        run: |
          pytest -q

      - name: Verify Neon PostgreSQL integration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import uuid

          from database.connection import (
              connect,
              initialize_database,
              is_postgresql_url,
          )
          from storage.repository import Repository

          database_url = os.environ.get("DATABASE_URL", "").strip()

          if not database_url:
              raise SystemExit("DATABASE_URL secret is missing.")

          if not is_postgresql_url(database_url):
              raise SystemExit(
                  "DATABASE_URL is not a PostgreSQL URL."
              )

          initialize_database(database_url)

          run_id = (
              "ITB2_GITHUB_NEON_TEST_"
              + uuid.uuid4().hex
          )

          repository = Repository(database_url)

          repository.store(
              table="trade_runs",
              record={
                  "run_id": run_id,
                  "mode": "paper",
                  "status": "integration_test",
                  "started_at": "2026-01-01T00:00:00+00:00",
              },
          )

          with connect(database_url) as connection:
              row = connection.execute(
                  """
                  SELECT run_id, mode, status
                  FROM trade_runs
                  WHERE run_id = %s
                  """,
                  (run_id,),
              ).fetchone()

          if row is None:
              raise SystemExit(
                  "Neon write/read verification failed."
              )

          if tuple(row) != (
              run_id,
              "paper",
              "integration_test",
          ):
              raise SystemExit(
                  "Neon returned unexpected test data."
              )

          with connect(database_url) as connection:
              connection.execute(
                  """
                  DELETE FROM trade_runs
                  WHERE run_id = %s
                  """,
                  (run_id,),
              )
              connection.commit()

          print(
              "PASS: GitHub runner connected to Neon PostgreSQL."
          )
          print(
              "PASS: Application repository wrote and read a record."
          )
          print(
              "PASS: Temporary integration record was deleted."
          )
          PY

      - name: Diagnostic summary
        if: always()
        run: |
          echo "=========================================="
          echo "Insider Trade Bot 2.0 Diagnostic Complete"
          echo "=========================================="
